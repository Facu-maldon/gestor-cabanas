databases:
  - name: gestorcabanasdb
    plan: free
    databaseName: gestorcabanas
    user: gestorcabanas

services:
  - type: web
    plan: free
    name: gestorcabanas
    runtime: python
    buildCommand: './build.sh'
    startCommand: 'python -m gunicorn gestor-reservas.asgi:application -k uvicorn.workers.UvicornWorker'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gestorcabanasdb
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4