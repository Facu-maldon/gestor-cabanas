databases:
  - name: gestor_reservasdb
    plan: free
    databaseName: gestor_reservas
    user: gestor_reservas

services:
  - type: web
    plan: free
    name: gestor_reservas
    runtime: python
    buildCommand: './build.sh'
    startCommand: 'python -m gunicorn gestor_reservas.asgi:application -k uvicorn.workers.UvicornWorker'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gestor_reservasdb
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4