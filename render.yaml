databases:
  - name: gestor-cabanasdb
    plan: free
    databaseName: gestor-cabanas
    user: gestor-cabanas

services:
  - type: web
    plan: free
    name: gestor-cabanas
    runtime: python
    buildCommand: './build.sh'
    startCommand: 'python -m gunicorn gestor-reservas.asgi:application -k uvicorn.workers.UvicornWorker'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gestor-cabanasdb
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4