<div class="bg-white p-6 rounded-xl shadow-sm">
    
    <!-- BARRA DE NAVEGACIÓN DEL MES -->
    <div class="flex justify-between items-center mb-6">
        <button hx-get="{% url 'calendario_mensual_detallado' prev_year prev_month %}"
                hx-target="#calendario-container"
                class="px-3 py-1.5 bg-stone-100 hover:bg-stone-200 rounded-lg text-sm">
            ← Mes Anterior
        </button>
        
        <div class="flex items-center gap-4">
            <h2 class="text-xl font-bold text-stone-800">{{ month_name }} {{ year }}</h2>
            
            <!-- BOTÓN PARA VOLVER A LA VISTA ANUAL -->
            <button hx-get="{% url 'calendario_anual' year %}"
                    hx-target="#calendario-container"
                    class="text-xs bg-emerald-50 text-emerald-700 border border-emerald-200 px-3 py-1.5 rounded-lg hover:bg-emerald-100 font-medium">
                Ver Año Completo
            </button>
        </div>

        <button hx-get="{% url 'calendario_mensual_detallado' next_year next_month %}"
                hx-target="#calendario-container"
                class="px-3 py-1.5 bg-stone-100 hover:bg-stone-200 rounded-lg text-sm">
            Mes Siguiente →
        </button>
    </div>

    <!-- CUADRÍCULA DE DÍAS DE LA SEMANA -->
    <div class="grid grid-cols-7 gap-1 text-center font-semibold text-stone-500 text-xs mb-2">
        <div>Dom</div><div>Lun</div><div>Mar</div><div>Mié</div><div>Jue</div><div>Vie</div><div>Sáb</div>
    </div>

    <!-- MATRIZ DE DÍAS -->
    <div class="grid grid-cols-7 gap-1">
        {% for semana in dias_del_mes %}
            {% for dia in semana %}
                <div class="h-24 border border-stone-200 rounded-lg p-1.5 flex flex-col justify-between overflow-hidden transition-colors
                    {% if not dia.es_mes_actual %} bg-stone-50 text-stone-300 {% else %} bg-white text-stone-700 {% endif %}">
                    
                    <!-- Número del día -->
                    <div class="flex justify-between items-center">
                        <span class="text-xs font-bold {% if not dia.es_mes_actual %} opacity-50 {% endif %}">
                            {{ dia.day }}
                        </span>
                    </div>

                    <!-- Reservas / Cabañas ocupadas ese día -->
                    <div class="flex flex-col gap-1 overflow-y-auto max-h-16">
                        {% for item in dia.cabanas %}
                            <button hx-get="{% url 'modificar_reserva' item.reserva_id %}"
                                    hx-target="#modal-container">
                                <div class="text-[11px] leading-tight text-white font-medium px-1.5 py-0.5 rounded truncate shadow-xs
                                            {% if item.es_extremo %} text-stone-950 font-extrabold {% else %} text-white font-medium {% endif %}"
                                    style="background-color: {{ item.color }};"
                                    title="{{ item.nombre }} - {{ item.cliente_nombre }}"
                                    >
                                    {{ item.nombre }}: {{ item.cliente_nombre }}
                                </div>
                            </button>
                        {% endfor %}
                    </div>

                </div>
            {% endfor %}
        {% endfor %}
    </div>

</div>
