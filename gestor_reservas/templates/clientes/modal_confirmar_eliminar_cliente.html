{% extends 'diseno_modal.html' %}

{% block content %}
<div class="flex justify-between items-center pb-3 border-b border-stone-200 mb-4">
    <h3 class="text-lg font-bold text-red-600">Eliminar Cliente</h3>
    <button type="button" onclick="cerrarModal()" class="text-stone-400 hover:text-stone-600">✕</button>
</div>

<form method="post" hx-post="{% url 'eliminar_cliente' cliente.pk %}">
    {% csrf_token %}
    
    <p class="text-sm text-stone-600 mb-2">
        ¿Estás seguro de que deseas eliminar a <strong class="text-stone-900">{{ cliente.nombre }}</strong>?
    </p>
    <p class="text-xs text-amber-700 bg-amber-50 border border-amber-200 p-2.5 rounded-lg mb-6">
        ⚠️ Si este cliente tiene reservas asociadas, podrían verse afectadas o eliminarse según la configuración de tu base de datos.
    </p>

    <div class="flex justify-end gap-2">
        <button type="button" onclick="cerrarModal()" class="px-4 py-2 text-sm text-stone-600 bg-stone-100 hover:bg-stone-200 rounded-lg">
            Cancelar
        </button>
        <button type="submit" class="px-4 py-2 text-sm text-white bg-red-600 hover:bg-red-700 rounded-lg font-medium">
            Sí, eliminar
        </button>
    </div>
</form>
{% endblock %}
