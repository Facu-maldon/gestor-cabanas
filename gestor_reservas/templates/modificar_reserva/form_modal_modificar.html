<script>
        // Cerrar modal del cliente automáticamente cuando HTMX avise que se guardó la reserva
        document.body.addEventListener('clienteActualizado', function() {
            document.getElementById('modal-cliente-container').innerHTML = '';
        });
</script>

<div class="fixed inset-0 bg-stone-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6 border border-stone-200">
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-lg font-bold text-stone-800">Modificar Reserva</h3>
            <button onclick="document.getElementById('modal-container').innerHTML=''" class="text-stone-400 hover:text-stone-600">✕</button>
        </div>

        <form hx-post="{% url 'modificar_reserva' pk %}" hx-target="#modal-container" class="space-y-4">
            {% csrf_token %}

            {% if form.non_field_errors %}
                <div class="mb-4 p-3 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm">
                    {% for error in form.non_field_errors %}
                        <p>{{ error }}</p>
                    {% endfor %}
                </div>
            {% endif %}            
            <div>
                <label class="block text-xs font-semibold text-stone-600 mb-1">Cabaña</label>
                {{ form.cabana }}
            </div>
            <div>
                <div id="contenedor-cliente" hx-get="{% url 'actualizar_lista_clientes' %}" hx-trigger="clienteActualizado from:body">
                    <label>Cliente</label>
                    {{ form.cliente }}
                </div>
                <button type="button" hx-get="{% url 'crear_cliente' %}" hx-target="#modal-cliente-container">Crear cliente</button>
            </div>
            
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-xs font-semibold text-stone-600 mb-1">Desde</label>
                    {{ form.fecha_inicio }}
                </div>
                <div>
                    <label class="block text-xs font-semibold text-stone-600 mb-1">Hasta</label>
                    {{ form.fecha_fin }}
                </div>
            </div>
            <div>
                <label class="block text-xs font-semibold text-stone-600 mb-1">Notas</label>
                {{ form.notas }}
            </div>

            <div class="flex justify-end gap-2 pt-2">
                <button type="button" onclick="document.getElementById('modal-container').innerHTML=''" class="px-4 py-2 text-stone-600 text-sm font-medium">Cancelar</button>
                <button type="submit" class="px-4 py-2 bg-emerald-700 hover:bg-emerald-800 text-white rounded-md text-sm font-medium shadow-sm">Guardar Cambios</button>
            </div>
        </form>
    </div>
</div>
