<div class="fixed inset-0 bg-stone-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6 border border-stone-200">
        <div class="flex justify-between items-center mb-4">
            <h3 class="text-lg font-bold text-stone-800">Eliminar Reserva</h3>
            <button onclick="document.getElementById('modal-container').innerHTML=''" class="text-stone-400 hover:text-stone-600">✕</button>
        </div>

        <form hx-post="{% url 'eliminar_reserva' reserva.pk %}" hx-target="#modal-container" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-semibold text-stone-600 mb-1">Nombre del huesped:</label>
                {{ reserva.cliente.nombre }} {{ reserva.cliente.apellido }}
            </div>
            <div>
                <label class="block text-xs font-semibold text-stone-600 mb-1">Cabaña: </label>{{ reserva.cabana.nombre }}
            </div>
            <div class="columns-2">
                <div>
                    <label class="block text-xs font-semibold text-stone-600 mb-1">Inicio: </label>{{ reserva.fecha_inicio }} 
                </div>
                <div>
                    <label class="block text-xs font-semibold text-stone-600 mb-1">Fin: </label>{{ reserva.fecha_fin }} 
                </div>
            </div>

            <div class="flex justify-end gap-2 pt-2">
                <button type="button" onclick="document.getElementById('modal-container').innerHTML=''" class="px-4 py-2 text-stone-600 text-sm font-medium">Cancelar</button>
                <button type="submit" class="px-4 py-2 bg-emerald-700 hover:bg-emerald-800 text-white rounded-md text-sm font-medium shadow-sm">Eliminar reserva</button>
            </div>
        </form>

    </div>
</div>
