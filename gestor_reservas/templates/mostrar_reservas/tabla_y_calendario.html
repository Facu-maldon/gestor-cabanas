<div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
    <!-- Calendario Mensual -->
    <div class="lg:col-span-2 bg-white p-4 md:p-6 rounded-xl shadow-sm border border-stone-200">

        <div class="gap-1" id="calendario-container" hx-trigger="load" hx-get="{% url 'calendario_anual_actual' %}">
            Cargando calendario...
        </div>
    </div>

    <!-- Lista de Reservas Realizadas -->
    <div class="bg-white p-4 md:p-6 rounded-xl shadow-sm border border-stone-200">
        <h3 class="text-lg font-semibold text-stone-800 mb-4">Reservas Realizadas</h3>
        <div class="space-y-3 max-h-[500px] overflow-y-auto" 
                hx-get="{% url 'actualizar_lista_reservas' %}"
                hx-trigger="reservaActualizada from:body, load" 
                hx-target="#reservas-realizadas-container"
                id="reservas-realizadas-container">

        </div>
    </div>
</div>
